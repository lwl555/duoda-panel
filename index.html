<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="color-scheme" content="light dark" />
<title>多答 · 后台</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#16181d; --ink-2:#5b6270; --ink-3:#8d94a3;
    --line:#e6e8ee; --brand:#1f6feb; --brand-ink:#ffffff; --ok:#1a9f5a; --warn:#c9821a; --bad:#d64545;
    --chip:#f1f3f7; --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101216; --card:#181b21; --ink:#eef1f6; --ink-2:#a8b0bf; --ink-3:#7b8496;
      --line:#262b34; --brand:#4b8df8; --brand-ink:#0b0d10; --ok:#3ecf8e; --warn:#e0a94a; --bad:#f0736f;
      --chip:#20252d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding:16px 14px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

  header{display:flex;align-items:center;gap:10px;padding:4px 2px 2px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);
    display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto}
  .titles{flex:1;min-width:0}
  .titles h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px}
  .titles p{margin:1px 0 0;font-size:12.5px;color:var(--ink-3)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(26,159,90,.2)}
  .dot.off{background:var(--bad)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 12px 10px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:22px;line-height:1.15;font-weight:680;letter-spacing:-.4px}
  .stat span{font-size:12px;color:var(--ink-3)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden}
  .card > .head{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
  .card > .head h2{margin:0;font-size:14.5px;font-weight:640;flex:1}
  .card > .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
  .hint{font-size:12.5px;color:var(--ink-3);margin:0}

  label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2)}
  input,textarea{
    width:100%;font:inherit;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;
    transition:border-color .15s,box-shadow .15s;min-height:44px;
  }
  textarea{resize:vertical;min-height:104px;line-height:1.6}
  input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
  .seg{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;
    padding:9px 6px;border-radius:9px;cursor:pointer;min-height:38px}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:620;box-shadow:0 1px 3px rgba(0,0,0,.08)}

  .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .switch{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
  .switch input{appearance:none;-webkit-appearance:none;width:42px;height:25px;border-radius:99px;background:var(--line);
    position:relative;cursor:pointer;min-height:0;padding:0;border:0;transition:background .18s;flex:0 0 auto}
  .switch input::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
  .switch input:checked{background:var(--brand)}
  .switch input:checked::after{transform:translateX(17px)}

  button.btn{
    font:inherit;font-weight:620;font-size:14px;border-radius:12px;border:1px solid transparent;
    padding:12px 16px;min-height:46px;cursor:pointer;background:var(--brand);color:var(--brand-ink);
    transition:filter .15s,transform .06s;
  }
  button.btn:active{transform:translateY(1px)}
  button.btn:disabled{opacity:.55;cursor:default}
  button.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  button.btn.small{min-height:38px;padding:8px 12px;font-size:13px;border-radius:10px;font-weight:560}
  .actions{display:flex;gap:8px}
  .actions .btn{flex:1}

  .status{font-size:12.5px;color:var(--ink-3);min-height:18px;margin:0}
  .status.ok{color:var(--ok)} .status.bad{color:var(--bad)}

  .devices{display:flex;flex-direction:column;gap:8px}
  .dev{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .dev .avatar{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;
    font-size:13px;font-weight:640;color:var(--ink-2);flex:0 0 auto}
  .dev .meta{flex:1;min-width:0}
  .dev .meta strong{display:block;font-size:13.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dev .meta small{color:var(--ink-3);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
  .badge.release{background:rgba(26,159,90,.14);color:var(--ok)}
  .icon-btn{border:0;background:transparent;color:var(--ink-3);font-size:20px;line-height:1;cursor:pointer;
    width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;padding:0}
  .icon-btn:hover{background:var(--chip);color:var(--bad)}
  .empty{text-align:center;color:var(--ink-3);font-size:13px;padding:18px 8px}

  .kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:13px;margin:0}
  .kv span:nth-child(odd){color:var(--ink-2)}
  .kv span:nth-child(even){text-align:right;font-weight:560}

  details.card > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:8px;font-weight:620;font-size:14px}
  details.card > summary::-webkit-details-marker{display:none}
  details.card > summary .caret{margin-left:auto;color:var(--ink-3);transition:transform .18s}
  details[open] > summary .caret{transform:rotate(90deg)}
  details.card .body{padding-top:0}

  footer{text-align:center;color:var(--ink-3);font-size:12px;padding:6px 0 0}
  footer a{color:var(--ink-3)}
  code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:12px}
  @media (max-width:400px){
    .stat b{font-size:19px}
    .stat{padding:10px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">多</div>
    <div class="titles">
      <h1>多答 · 后台</h1>
      <p id="subtitle">正在连接…</p>
    </div>
    <div class="dot" id="dot" title="连接状态"></div>
  </header>

  <section class="stats">
    <div class="stat"><b id="statDevices">–</b><span>设备总数</span></div>
    <div class="stat"><b id="statToday">–</b><span>今日活跃</span></div>
    <div class="stat"><b id="statVersion">–</b><span>公告版本</span></div>
  </section>

  <section class="card">
    <div class="head"><h2>发一条公告</h2><span class="badge" id="annBadge">未发布</span></div>
    <div class="body">
      <div class="seg" role="group" aria-label="语言">
        <button type="button" data-lang="zh-CN" aria-pressed="true">简体</button>
        <button type="button" data-lang="zh-Hant" aria-pressed="false">繁體</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
      <label class="f">标题
        <input id="title" maxlength="60" placeholder="例如：多答 v1.5.0 已更新" autocomplete="off" />
      </label>
      <label class="f">内容
        <textarea id="body" maxlength="2000" placeholder="想对用户说的话，换行会原样显示。"></textarea>
      </label>
      <div class="row">
        <label class="switch"><input type="checkbox" id="onceOnly" /> 只弹一次（关掉则一直显示）</label>
      </div>
      <div class="actions">
        <button class="btn" id="publishBtn">发布公告</button>
      </div>
      <p class="status" id="annStatus"></p>
      <p class="hint">发布后 APP 端下次拉公告就能看到；三种语言都填了才会按系统语言自动匹配。</p>
    </div>
  </section>

  <section class="card">
    <div class="head"><h2>设备</h2><button class="btn ghost small" id="refreshDevices">刷新</button></div>
    <div class="body">
      <div class="devices" id="deviceList">
        <div class="empty">还没有设备上报。</div>
      </div>
      <p class="hint">需要先在 APP 里打开「设置 → 后台管理 → 设备上报」。同一台机器用匿名随机 ID 归集，不含个人信息。</p>
    </div>
  </section>

  <section class="card">
    <div class="head"><h2>远程配置</h2></div>
    <div class="body">
      <p class="kv">
        <span>上报开关</span><span id="cfgEnabled">–</span>
        <span>上报间隔</span><span id="cfgInterval">–</span>
        <span>配置缓存</span><span id="cfgTtl">–</span>
      </p>
      <p class="hint">这几项由服务端决定，这里只用来核对 APP 实际拿到的值。</p>
    </div>
  </section>

  <details class="card" id="connCard">
    <summary>连接设置<span class="caret">›</span></summary>
    <div class="body">
      <label class="f">后台地址
        <input id="baseUrl" placeholder="留空 = 当前页面地址" autocomplete="off" />
      </label>
      <label class="f">面板密钥
        <input id="secret" type="password" placeholder="部署时设置的 PANEL_SECRET" autocomplete="off" />
      </label>
      <div class="actions">
        <button class="btn ghost" id="saveConn">保存</button>
        <button class="btn" id="testConn">测试连接</button>
      </div>
      <button class="btn ghost small" id="copyAppUrl">复制要填进 APP 的地址</button>
      <p class="status" id="connStatus"></p>
      <p class="hint">地址和密钥只存在这台设备的浏览器里，不会上传。若后台是分享链接部署，地址里要带 <code>?sharecode=</code>。</p>
    </div>
  </details>

  <footer>多答 · 小林科技　<a href="#" id="homeLink">返回首页</a></footer>
</div>

<script>
(function () {
  'use strict';

  var KEY_BASE = 'duoda.panel.base';
  var KEY_SECRET = 'duoda.panel.secret';

  var state = {
    secret: '',
    base: '',
    configVersion: 0,
    announcements: [],
    devices: [],
    lang: 'zh-CN',
    drafts: {
      'zh-CN': { title: '', body: '' },
      'zh-Hant': { title: '', body: '' },
      'en': { title: '', body: '' }
    }
  };

  function $(id) { return document.getElementById(id); }

  function pageSharecode() {
    try { return new URLSearchParams(location.search).get('sharecode') || ''; }
    catch (e) { return ''; }
  }

  /**
   * 拼接口地址。
   *
   * 后台若是「分享链接」部署，访问入口形如 https://host/?sharecode=xxx，
   * 而接口路径是 /v1/devices。直接字符串相加会把路径塞进 query 里（服务端只会看到一次根路径请求），
   * 所以这里统一：base 上已有的参数（含 sharecode）当作公共参数，路径与自己的参数再合并上去。
   */
  function apiUrl(path, params) {
    var baseRaw = (state.base || location.origin).trim();
    var base;
    try { base = new URL(baseRaw); }
    catch (e) { throw new Error('后台地址格式不对'); }

    var prefix = base.pathname.replace(/\/+$/, '');           // '' 或 '/prefix'
    var target = new URL(base.origin + prefix + path);        // path 以 / 开头

    // base 自带的固定参数先挂上（sharecode、自定义 token 等）
    base.searchParams.forEach(function (v, k) { target.searchParams.set(k, v); });
    // 页面 URL 上的 sharecode 再兜一层（本地打开文件时 base 里没有，就靠这个）
    var sc = pageSharecode();
    if (sc && !target.searchParams.has('sharecode')) target.searchParams.set('sharecode', sc);
    // 本次请求参数
    var p = params || {};
    Object.keys(p).forEach(function (k) {
      if (p[k] !== undefined && p[k] !== null && p[k] !== '') target.searchParams.set(k, p[k]);
    });
    return target.toString();
  }

  function setStatus(el, text, tone) {
    if (!el) return;
    el.textContent = text || '';
    el.className = 'status' + (tone ? ' ' + tone : '');
  }

  function relTime(ms) {
    if (!ms) return '未知';
    var diff = Date.now() - ms;
    if (diff < 60000) return '刚刚';
    var min = Math.floor(diff / 60000);
    if (min < 60) return min + ' 分钟前';
    var h = Math.floor(min / 60);
    if (h < 24) return h + ' 小时前';
    var d = Math.floor(h / 24);
    if (d < 30) return d + ' 天前';
    return new Date(ms).toLocaleDateString();
  }

  function shortId(id) {
    if (!id) return '?';
    var s = String(id).replace(/[^a-zA-Z0-9]/g, '').slice(0, 2).toUpperCase();
    return s || '?';
  }

  async function api(path, options) {
    var opt = options || {};
    var params = Object.assign({}, opt.params);
    if (state.secret) params.secret = state.secret;
    var url = apiUrl(path, params);
    var res = await fetch(url, {
      method: opt.method || 'GET',
      headers: opt.body ? { 'Content-Type': 'application/json' } : undefined,
      body: opt.body ? JSON.stringify(opt.body) : undefined,
      cache: 'no-store'
    });
    var text = await res.text();
    var data = null;
    try { data = JSON.parse(text); } catch (e) { data = null; }
    if (!res.ok) {
      throw new Error((data && (data.error || data.message)) || ('请求失败 HTTP ' + res.status));
    }
    if (data === null) {
      throw new Error('接口返回的不是数据。分享链接部署时请确认地址里带了 ?sharecode=');
    }
    return data;
  }

  function loadConn() {
    try {
      state.base = localStorage.getItem(KEY_BASE) || '';
      state.secret = localStorage.getItem(KEY_SECRET) || '';
    } catch (e) { /* 隐私模式忽略 */ }
    // URL 参数优先，方便把「GitHub Pages + Supabase」拼成一条点开就能用的链接：
    //   https://xxx.github.io/duoda/?base=https://ref.supabase.co/functions/v1/duoda&secret=xxx
    try {
      var q = new URLSearchParams(location.search);
      var qBase = (q.get('base') || '').trim();
      var qSecret = (q.get('secret') || '').trim();
      if (qBase) state.base = qBase;
      if (qSecret) state.secret = qSecret;
      if (qBase || qSecret) {
        if (qBase) localStorage.setItem(KEY_BASE, state.base);
        if (qSecret) localStorage.setItem(KEY_SECRET, state.secret);
      }
    } catch (e) { /* 忽略 */ }
    $('baseUrl').value = state.base;
    $('secret').value = state.secret;
  }

  function saveConn() {
    state.base = $('baseUrl').value.trim();
    state.secret = $('secret').value.trim();
    try {
      if (state.base) localStorage.setItem(KEY_BASE, state.base); else localStorage.removeItem(KEY_BASE);
      if (state.secret) localStorage.setItem(KEY_SECRET, state.secret); else localStorage.removeItem(KEY_SECRET);
    } catch (e) { /* 忽略 */ }
  }

  function pickLang(lang) {
    state.drafts[state.lang] = { title: $('title').value, body: $('body').value };
    state.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
    });
    var d = state.drafts[lang] || { title: '', body: '' };
    $('title').value = d.title;
    $('body').value = d.body;
  }

  function fillFromStore() {
    var first = (state.announcements || [])[0];
    if (!first) return;
    ['zh-CN', 'zh-Hant', 'en'].forEach(function (l) {
      var t = (first.title && (first.title[l] || first.title['zh-CN'])) || '';
      var b = (first.body && (first.body[l] || first.body['zh-CN'])) || '';
      state.drafts[l] = { title: t, body: b };
    });
    $('onceOnly').checked = Number(first.max_views) === 1;
    var d = state.drafts[state.lang];
    $('title').value = d.title;
    $('body').value = d.body;
  }

  async function publish() {
    var btn = $('publishBtn');
    state.drafts[state.lang] = { title: $('title').value.trim(), body: $('body').value.trim() };
    var d = state.drafts;
    if (!d['zh-CN'].title && !d['zh-CN'].body) {
      setStatus($('annStatus'), '至少填上简体中文的标题或内容。', 'bad');
      return;
    }
    var title = {}, body = {};
    ['zh-CN', 'zh-Hant', 'en'].forEach(function (l) {
      if (d[l].title) title[l] = d[l].title;
      if (d[l].body) body[l] = d[l].body;
    });
    if (Object.keys(title).length === 0) title['zh-CN'] = '公告';
    if (Object.keys(body).length === 0) body['zh-CN'] = title['zh-CN'];

    var existing = (state.announcements || [])[0];
    var payload = {
      config_version: state.configVersion,
      kill_switch: false,
      announcements: [{
        id: (existing && existing.id) || ('ann-' + Date.now()),
        priority: (existing && existing.priority) || 9,
        max_views: $('onceOnly').checked ? 1 : 0,
        title: title,
        body: body
      }]
    };

    btn.disabled = true;
    setStatus($('annStatus'), '正在发布…');
    try {
      var res = await api('/v1/admin/announcements', { method: 'PUT', body: payload });
      state.configVersion = res.config_version || (state.configVersion + 1);
      $('statVersion').textContent = String(state.configVersion);
      $('annBadge').textContent = 'v' + state.configVersion;
      setStatus($('annStatus'), '已发布 · 公告版本 ' + state.configVersion + ' · ' + new Date().toLocaleTimeString(), 'ok');
      await loadState();
    } catch (err) {
      setStatus($('annStatus'), '发布失败：' + err.message, 'bad');
    } finally {
      btn.disabled = false;
    }
  }

  function renderDevices() {
    var list = (state.devices || []).slice().sort(function (a, b) {
      return (b.last_seen_ms || 0) - (a.last_seen_ms || 0);
    });
    var box = $('deviceList');
    box.textContent = '';
    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有设备上报。';
      box.appendChild(empty);
      return;
    }
    list.forEach(function (dev) {
      var row = document.createElement('div');
      row.className = 'dev';

      var avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = shortId(dev.device_id);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var name = document.createElement('strong');
      name.textContent = [dev.brand, dev.model].filter(Boolean).join(' ') || '未知机型';
      var sub = document.createElement('small');
      sub.textContent = 'v' + (dev.app_version || '?') + ' · ' + relTime(dev.last_seen_ms) +
        ' · 上报 ' + (dev.reports || 0) + ' 次';
      meta.appendChild(name);
      meta.appendChild(sub);

      var badge = document.createElement('span');
      badge.className = 'badge' + (dev.channel === 'release' ? ' release' : '');
      badge.textContent = dev.channel === 'release' ? '正式' : (dev.channel || '未知');

      var del = document.createElement('button');
      del.className = 'icon-btn';
      del.type = 'button';
      del.title = '移除这台设备';
      del.setAttribute('aria-label', '移除这台设备');
      del.textContent = '×';
      del.addEventListener('click', function () { removeDevice(dev.device_id); });

      row.appendChild(avatar);
      row.appendChild(meta);
      row.appendChild(badge);
      row.appendChild(del);
      box.appendChild(row);
    });
  }

  async function removeDevice(id) {
    if (!id) return;
    if (!confirm('从列表里移除这台设备？只删记录，不影响那台手机上的 APP。')) return;
    try {
      await api('/v1/admin/devices', { method: 'DELETE', params: { id: id } });
      state.devices = (state.devices || []).filter(function (d) { return d.device_id !== id; });
      renderDevices();
      updateStats();
    } catch (err) {
      alert('删除失败：' + err.message);
    }
  }

  function updateStats() {
    var list = state.devices || [];
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayCount = list.filter(function (d) { return (d.last_seen_ms || 0) >= today.getTime(); }).length;
    $('statDevices').textContent = String(list.length);
    $('statToday').textContent = String(todayCount);
    $('statVersion').textContent = String(state.configVersion || 0);
  }

  async function loadDevices() {
    try {
      var res = await api('/v1/devices');
      state.devices = res.devices || [];
    } catch (err) {
      state.devices = [];
    }
    renderDevices();
    updateStats();
  }

  async function loadState() {
    var res = await api('/v1/admin/state');
    var ann = res.announcements || {};
    state.configVersion = Number(ann.config_version) || 0;
    state.announcements = ann.announcements || [];
    fillFromStore();
    updateStats();
    if (state.configVersion > 0) $('annBadge').textContent = 'v' + state.configVersion;
  }

  async function loadConfig() {
    try {
      var res = await api('/v1/config');
      $('cfgEnabled').textContent = res.telemetry_enabled ? '开启' : '关闭';
      $('cfgInterval').textContent = (res.report_interval_hours || '?') + ' 小时';
      $('cfgTtl').textContent = (res.config_ttl_hours || '?') + ' 小时';
    } catch (err) {
      $('cfgEnabled').textContent = '–';
      $('cfgInterval').textContent = '–';
      $('cfgTtl').textContent = '–';
    }
  }

  async function boot() {
    loadConn();
    if (!state.secret) {
      $('dot').className = 'dot';
      $('subtitle').textContent = '先在下面「连接设置」里填面板密钥';
      $('connCard').open = true;
      return;
    }
    // 直接用本地文件打开时没有 origin，必须手动填后台地址
    if (!state.base && location.protocol === 'file:') {
      $('dot').className = 'dot';
      $('subtitle').textContent = '本地打开：请先填后台地址';
      $('connCard').open = true;
      setStatus($('connStatus'), '本地文件打开时，需要填上后台地址（含 ?sharecode=）才能连上。', '');
      return;
    }
    setStatus($('connStatus'), '正在连接…');
    try {
      await loadState();
      await loadDevices();
      await loadConfig();
      $('dot').className = 'dot on';
      $('subtitle').textContent = '已连接 · 公告 ' + state.configVersion + ' · 设备 ' + state.devices.length;
      setStatus($('connStatus'), '连接正常', 'ok');
    } catch (err) {
      $('dot').className = 'dot off';
      $('subtitle').textContent = '连接失败';
      var extra = state.base ? '' : '（当前没填后台地址，面板默认连的是本页所在的域名，GitHub Pages 上连不到接口，请在下面填上 Supabase 函数地址）';
      setStatus($('connStatus'), '连接失败：' + err.message + extra, 'bad');
      $('connCard').open = true;
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () { pickLang(b.getAttribute('data-lang')); });
  });

  $('publishBtn').addEventListener('click', publish);

  $('saveConn').addEventListener('click', function () {
    saveConn();
    setStatus($('connStatus'), '已保存', 'ok');
    boot();
  });

  $('testConn').addEventListener('click', function () {
    saveConn();
    setStatus($('connStatus'), '正在测试…');
    loadState().then(function () {
      $('dot').className = 'dot on';
      setStatus($('connStatus'), '连接正常 · 公告版本 ' + state.configVersion, 'ok');
      loadDevices();
    }).catch(function (err) {
      $('dot').className = 'dot off';
      setStatus($('connStatus'), '连不上：' + err.message, 'bad');
    });
  });

  $('refreshDevices').addEventListener('click', function () { loadDevices(); });

  $('copyAppUrl').addEventListener('click', function () {
    var url = (state.base || location.origin).trim();
    var sc = pageSharecode();
    var full = url;
    try {
      var u = new URL(url);
      if (sc && !u.searchParams.has('sharecode')) u.searchParams.set('sharecode', sc);
      full = u.toString();
    } catch (e) { /* 原样 */ }
    var done = function () { setStatus($('connStatus'), '已复制：' + full, 'ok'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(done, function () { window.prompt('复制下面的地址', full); });
    } else {
      window.prompt('复制下面的地址', full);
    }
  });

  $('homeLink').addEventListener('click', function (e) {
    e.preventDefault();
    var sc = pageSharecode();
    location.href = '/' + (sc ? '?sharecode=' + encodeURIComponent(sc) : '');
  });

  boot();
})();
</script>
</body>
</html>
